<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de personas | NextHire</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body class="welcome-body">

    <header class="welcome-header">
        <a href="index.html" class="brand">
            <span class="brand-icon">N</span>
            <span>NextHire<span class="purple-dot">.</span></span>
        </a>
        <span class="header-message">Tu futuro comienza hoy</span>
    </header>

    <main class="form-page">
        <section class="form-card">

            <a href="registro.html" class="back-link">← Volver a las opciones</a>

            <div class="form-logo">N<span>.</span></div>

            <p class="welcome-label">TU FUTURO PROFESIONAL</p>

            <h1>Creá tu cuenta</h1>
            <p class="form-description">
                Registrate para descubrir empleos y oportunidades de pasantías.
            </p>

            <form id="personForm">

                <div class="form-group">
                    <label for="fullName">Nombre y apellido</label>
                    <input
                        type="text"
                        id="fullName"
                        name="fullName"
                        placeholder="Ej.: María González"
                        autocomplete="name"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="personEmail">Correo electrónico</label>
                    <input
                        type="email"
                        id="personEmail"
                        name="email"
                        placeholder="tu@correo.com"
                        autocomplete="email"
                        required
                    >
                </div>

                <div class="form-group">
                    <label for="personPassword">Contraseña</label>
                    <input
                        type="password"
                        id="personPassword"
                        name="password"
                        placeholder="Creá una contraseña"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                    <small>Usá al menos 8 caracteres.</small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirmar contraseña</label>
                    <input
                        type="password"
                        id="confirmPassword"
                        name="confirmPassword"
                        placeholder="Repetí tu contraseña"
                        autocomplete="new-password"
                        minlength="8"
                        required
                    >
                </div>

                <label class="terms-check">
                    <input type="checkbox" id="acceptTerms" required>
                    <span>Acepto que estos datos se utilicen para esta demostración.</span>
                </label>

                <button type="submit" class="primary-button form-submit">
    Registrarme <span>→</span>
</button>

                <p id="personMessage" class="form-message" role="status"></p>

            </form>

            <p class="form-bottom">
                ¿Sos una empresa?
                <a href="empresa.html">Registrate aquí</a>
            </p>

        </section>
    </main>

    <footer class="welcome-footer">
        <span>NextHire © 2026</span>
        <span>Creá tu futuro profesional.</span>
    </footer>

    <script src="script.js"></script>
</body>
</html>
